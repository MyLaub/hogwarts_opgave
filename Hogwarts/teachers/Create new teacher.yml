info:
  name: Create new teacher
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/teachers
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |2-
        {
            "name": "Minerva McGonagall",
            "house": "bla"
          }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
